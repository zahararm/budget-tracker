<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budget Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <h1>Budget Tracker</h1>
  <p class="tag">See how much of your paycheck you’re actually keeping!</p>

  <div class="cols">
    <div class="card">
      <h2>This month</h2>
      <div class="row">
        <label for="income">Money coming in ($)</label>
        <input id="income" type="number" min="0" step="0.01" placeholder="e.g. 2500">
      </div>
      <hr>
      <p class="note">Money going out ($)</p>
      <div class="row"><label for="food">Food</label><input id="food" type="number" min="0" step="0.01" placeholder="0"></div>
      <div class="row"><label for="utilities">Utilities</label><input id="utilities" type="number" min="0" step="0.01" placeholder="0"></div>
      <div class="row"><label for="entertainment">Entertainment</label><input id="entertainment" type="number" min="0" step="0.01" placeholder="0"></div>
      <div class="row"><label for="transport">Transport</label><input id="transport" type="number" min="0" step="0.01" placeholder="0"></div>
      <div class="error" id="error"></div>
      <div class="btns">
        <button class="btn" id="go" type="button">Calculate</button>
        <button class="btn plain" id="clear" type="button">Clear</button>
      </div>
    </div>

    <div class="card">
      <h2>Results</h2>
      <p class="empty" id="placeholder">Fill in the form and calculate!</p>
      <div id="report">
        <p class="big" id="rNet"></p>
        <p class="note">left over this month</p>

        <div class="line"><span>Income</span><b id="rIncome"></b></div>
        <div class="line"><span>Expenses</span><b id="rExp"></b></div>
        <div class="line"><span>Savings rate</span><b id="rRate"></b></div>

        <div class="msg" id="msg"></div>

        <p class="note">Where it went</p>
        <div id="cats"></div>
        <br>
        <button class="btn plain" id="csv" type="button">Download CSV</button>
      </div>
    </div>
  </div>

  <footer>Made as a personal project. Your numbers stay in your broswer!</footer>
</div>

<script src="script.js"></script>
</body>
</html>
